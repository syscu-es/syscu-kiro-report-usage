name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a new push cancels the obsolete run of the same ref instead of piling up in the runner queue
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # SECURITY: this runner is self-hosted. Never run code from fork pull requests on it
    # (a public repo accepts PRs from anyone). Pushes and same-repo PRs run normally;
    # a maintainer reviews fork PRs and runs the checks locally before merging.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, contabo]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Runner info
        run: |
          uname -srm
          (lsb_release -ds 2>/dev/null || grep PRETTY_NAME /etc/os-release || true)
          echo "runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          (docker --version 2>/dev/null || echo "docker: not installed")
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=kiro_report --cov-report=term-missing --cov-fail-under=80
      - name: Smoke test the demo
        run: kiro-report --demo --yes --out /tmp/demo.html
