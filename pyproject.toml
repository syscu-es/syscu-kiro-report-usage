[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syscu-kiro-report-usage"
version = "0.1.0"
description = "Self-contained HTML report of Kiro usage and cost per IAM Identity Center user (AWS CUR + Kiro user activity report)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["kiro", "aws", "finops", "cost", "usage", "report", "iam-identity-center"]
authors = [{ name = "SysCu" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Topic :: System :: Systems Administration",
]
dependencies = ["boto3>=1.34", "pyarrow>=14"]

[project.urls]
Homepage = "https://github.com/syscu-es/syscu-kiro-report-usage"
Issues = "https://github.com/syscu-es/syscu-kiro-report-usage/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
kiro-report = "kiro_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kiro_report = ["assets/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["unit: fast tests with no AWS access"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
# explicit so local and CI results never depend on a user-level ruff config
select = ["F", "UP", "B"]
