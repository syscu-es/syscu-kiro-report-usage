<html lang="__LANG__">
<head>

<title>Kiro usage report</title>
<style>
__FONT_CSS__
:root{color-scheme:light;--bg:#FCFCFB;--surface:#fff;--surface2:#f2f5f9;--fg:#0b1220;--fg2:#3b4557;--muted:#667085;--line:#e4e8ee;--grid:#e9edf2;--axis:#c5ccd6;
--accent:#0284c7;--s1:#0284c7;--s2:#eb6834;--s3:#1baf7a;--s4:#8b5cf6;--s5:#94a3b8;
--crit:#c4302b;--critbg:#fdecea;--warn:#a15c00;--warnbg:#fff3dc;--ok:#15803d;--okbg:#e6f5eb;--info:#1d4ed8;--infobg:#eaf0ff}
:root[data-theme="dark"]{color-scheme:dark;--bg:#060B14;--surface:#0b1322;--surface2:#101a2c;--fg:#e8eef7;--fg2:#c2cad8;--muted:#8792a6;--line:#1b2638;--grid:#162133;--axis:#2a3850;
--accent:#38bdf8;--s1:#0b94d4;--s2:#d95926;--s3:#199e70;--s4:#8b6cf0;--s5:#64748b;
--crit:#ff8a80;--critbg:#3a1714;--warn:#ffc266;--warnbg:#33260e;--ok:#6fd08c;--okbg:#10291a;--info:#8fb0ff;--infobg:#16213a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#060B14;--surface:#0b1322;--surface2:#101a2c;--fg:#e8eef7;--fg2:#c2cad8;--muted:#8792a6;--line:#1b2638;--grid:#162133;--axis:#2a3850;
--accent:#38bdf8;--s1:#0b94d4;--s2:#d95926;--s3:#199e70;--s4:#8b6cf0;--s5:#64748b;
--crit:#ff8a80;--critbg:#3a1714;--warn:#ffc266;--warnbg:#33260e;--ok:#6fd08c;--okbg:#10291a;--info:#8fb0ff;--infobg:#16213a}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:15.5px/1.6 Figtree,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.mono{font-family:ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;font-weight:600}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16px}
.brand img{height:26px;width:auto}img[src=""]{display:none}
.logo-d{display:none}:root[data-theme="dark"] .logo-l{display:none}:root[data-theme="dark"] .logo-d{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:block}}
.nav{display:flex;gap:2px;align-items:center}.nav a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;padding:6px 10px;border-radius:8px}
.nav a:hover{background:var(--surface2);color:var(--fg)}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg2);border-radius:8px;padding:5px 10px;cursor:pointer}
.nav button{margin-left:6px}button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hero{position:relative;padding:56px 0 32px}.hero .mark{position:absolute;right:0;top:48px;width:170px;opacity:.95}
@media (max-width:860px){.hero .mark{display:none}}
@media (min-width:861px){.hero h1,.hero .lead{max-width:min(70ch,calc(100% - 210px))}}
.eyebrow{color:var(--accent)}
h1{font-size:clamp(28px,4.2vw,44px);line-height:1.12;letter-spacing:-.025em;margin:10px 0 14px;font-weight:700}
.lead{font-size:18px;color:var(--fg2);margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:30px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13.5px;line-height:1.4;margin-top:4px}
.kpi.crit .v{color:var(--crit)}.kpi.ok .v{color:var(--ok)}.kpi.warn .v{color:var(--warn)}
.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:18px}.meta span::before{content:"● ";color:var(--accent)}
section{padding:46px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(24px,3vw,32px);letter-spacing:-.02em;margin:8px 0 6px;line-height:1.2}h2 em{font-style:normal;color:var(--accent)}
h3{font-size:18px;margin:0 0 4px}.sub{color:var(--fg2);max-width:78ch;margin:0 0 22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-top:18px}
.card .note{color:var(--muted);font-size:13.5px;margin:2px 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.reading{border-left:3px solid var(--accent);padding:2px 0 2px 14px;color:var(--fg2);margin:16px 0 0}
.controls{display:flex;gap:22px;flex-wrap:wrap;align-items:center;margin:0 0 4px}
.controls .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.controls .lab{color:var(--muted);font-size:13px;margin-right:4px}
.chart{width:100%;position:relative;padding-top:20px}.chart svg{width:100%;height:auto;display:block;overflow:visible}.chart text{fill:var(--muted);font-size:11px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--fg2);margin:10px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 24px rgba(0,0,0,.12);display:none;min-width:170px;z-index:5}
.tip b{display:block;margin-bottom:2px}.tip div{display:flex;justify-content:space-between;gap:12px}
.hbar{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.hbar .t{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden}.hbar .t i{display:block;height:100%;border-radius:99px}.hbar .n{text-align:right;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}tfoot td{font-weight:650;border-top:2px solid var(--line)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}th.num{text-align:right}.tw{overflow-x:auto}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.crit{background:var(--critbg);color:var(--crit)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.info{background:var(--infobg);color:var(--info)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:6px;min-width:70px}.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.plan{display:grid;gap:12px}
.step{display:grid;grid-template-columns:150px 1fr;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.step .when{font-weight:650}.step.hoy .when{color:var(--crit)}.step.semana .when{color:var(--warn)}.step.mes .when{color:var(--info)}.step.cont .when{color:var(--ok)}
.step h3{margin:0 0 2px}.step p{margin:0;color:var(--fg2)}
.hbar.wide{grid-template-columns:190px 1fr 120px}.hbar.wide2{grid-template-columns:min(300px,38%) 1fr 90px}
details.box{border:1px solid var(--line);border-radius:12px;background:var(--surface2);margin-top:14px;padding:0}
details.box>summary{cursor:pointer;padding:9px 14px;font-weight:600;font-size:14px;color:var(--fg2);list-style:none}
details.box>summary::-webkit-details-marker{display:none}details.box>summary::before{content:"▸ ";color:var(--accent)}details.box[open]>summary::before{content:"▾ "}
details.box .inner{padding:2px 14px 14px;color:var(--fg2);font-size:14px}details.box .inner p{margin:6px 0}
.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 14px;max-height:220px;overflow:auto;margin:8px 0}
.ulist label{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donut{display:flex;gap:26px;align-items:center;flex-wrap:wrap}.donut svg{width:190px;height:190px;flex:none}
.donut .center{fill:var(--fg);font-size:26px;font-weight:700;text-anchor:middle}.donut .centerl{fill:var(--muted);font-size:11px;text-anchor:middle}
.seglist{display:grid;gap:8px;font-size:14px;flex:1;min-width:230px}.seglist div{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center}
.seglist i{width:10px;height:10px;border-radius:3px;display:block}.seglist small{display:block;color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.muted{color:var(--muted)}.small{font-size:13px}.hidden{display:none!important}
footer{border-top:1px solid var(--line);padding:30px 0 60px;color:var(--muted);font-size:13px}
footer .fb{display:flex;align-items:center;gap:10px;margin-bottom:8px}footer img{height:22px}
@media (max-width:860px){.step{grid-template-columns:1fr;gap:4px}.nav a{display:none}.hbar{grid-template-columns:90px 1fr 60px}}
@media print{header.top{position:static}.nav,.controls{display:none}.card,.kpi,.step{break-inside:avoid}h2,h3{break-after:avoid}.hero{padding:20px 0 16px}section{padding:22px 0}.tip{display:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><img class="logo-l" alt="" src="__LOGO_LIGHT__"><img class="logo-d" alt="" src="__LOGO_DARK__"><span>__BRAND_NAME__</span>
    <span class="muted" style="font-weight:500">· Kiro</span></div>
  <nav class="nav"><a href="#usage" data-i18n="nav_usage"></a><a href="#people" data-i18n="nav_people"></a><a href="#engagement" data-i18n="nav_eng"></a><a href="#costs" data-i18n="nav_costs"></a><a href="#findings" data-i18n="nav_findings"></a>
    <button id="lang" type="button">ES</button><button id="theme" type="button" data-i18n="theme"></button></nav>
</div></header>

<main class="wrap">
<div class="hero">
  <img class="mark logo-l" alt="" src="__LOGO_LIGHT__"><img class="mark logo-d" alt="" src="__LOGO_DARK__">
  <div class="mono eyebrow" data-i18n="eyebrow"></div>
  <h1 id="h1"></h1><p class="lead" id="lead"></p>
  <div class="kpis" id="kpis"></div><div class="meta" id="meta"></div>
</div>

<section id="usage">
  <div class="mono eyebrow" data-i18n="s1_eyebrow"></div>
  <h2 data-i18n-html="s1_h2"></h2><p class="sub" data-i18n="s1_sub"></p>
  <div class="card"><div class="controls" id="controls"></div>
    <details class="box" id="ufilter"></details>
    <details class="box"><summary data-i18n="defs_h"></summary><div class="inner" id="defs"></div></details></div>
  <div id="act-charts">
    <div class="grid2">
      <div class="card"><h3 data-i18n="c_cl"></h3><div class="chart" id="ch-cl"><div class="tip"></div></div><div class="legend" id="ch-cl-legend"></div></div>
      <div class="card"><h3 data-i18n="c_pl"></h3><div class="chart" id="ch-pl"><div class="tip"></div></div><div class="legend" id="ch-pl-legend"></div></div>
      <div class="card"><h3 data-i18n="c_ucl"></h3><div class="chart" id="ch-ucl"><div class="tip"></div></div><div class="legend" id="ch-ucl-legend"></div></div>
      <div class="card"><h3 data-i18n="c_upl"></h3><div class="chart" id="ch-upl"><div class="tip"></div></div><div class="legend" id="ch-upl-legend"></div></div>
    </div>
    <div class="grid2">
      <div class="card"><h3 data-i18n="c_upc"></h3><div id="hb-client"></div></div>
      <div class="card"><h3 data-i18n="c_mod"></h3><div id="hb-model"></div></div>
    </div>
    <div class="card"><h3 data-i18n="c_wd"></h3><p class="note" id="wd-note"></p><div id="hb-wd"></div></div>
  </div>
  <div class="card" id="cur-daily-card"><h3 data-i18n="c_daily"></h3><p class="note" id="daily-note"></p>
    <div class="chart" id="ch-daily"><div class="tip"></div></div><p class="reading" id="daily-reading"></p></div>
  <div class="card hidden" id="noact"><h3 data-i18n="noact_t"></h3><p class="note" data-i18n="noact_p"></p></div>
</section>

<section id="people">
  <div class="mono eyebrow" data-i18n="s2_eyebrow"></div>
  <h2 data-i18n-html="s2_h2"></h2><p class="sub" id="s2-sub"></p>
  <div class="card"><h3 data-i18n="c_pm"></h3><div class="legend" id="ch-pm-legend"></div><div class="chart" id="ch-pm"><div class="tip"></div></div></div>
  <div class="card"><h3 data-i18n="c_detail"></h3><p class="note" data-i18n="detail_note"></p><div class="tw"><table id="tbl"></table></div>
    <div class="actions"><button type="button" id="exp-people" data-i18n="exp_people"></button></div></div>
</section>

<section id="engagement">
  <div class="mono eyebrow" data-i18n="s5_eyebrow"></div>
  <h2 data-i18n-html="s5_h2"></h2><p class="sub" id="s5-sub"></p>
  <div class="grid2">
    <div class="card"><h3 data-i18n="c_seg"></h3><div class="donut" id="seg"></div></div>
    <div class="card"><h3 data-i18n="c_fun"></h3><p class="note" data-i18n="fun_note"></p><div id="funnel"></div></div>
  </div>
  <div class="card"><h3 data-i18n="c_top"></h3><div id="hb-top"></div></div>
  <div class="card"><h3 data-i18n="c_tl"></h3><p class="note" data-i18n="tl_note"></p>
    <div class="controls" id="eng-controls"></div><div class="tw"><table id="eng-tbl"></table></div>
    <div class="actions"><button type="button" id="exp-eng" data-i18n="exp_eng"></button></div></div>
</section>

<section id="costs">
  <div class="mono eyebrow" data-i18n="s3_eyebrow"></div>
  <h2 data-i18n-html="s3_h2"></h2><p class="sub" data-i18n="s3_sub"></p>
  <div class="card"><h3 data-i18n="c_subs"></h3><p class="note" id="subs-note"></p>
    <div class="chart" id="ch-subs"><div class="tip"></div></div><div class="legend" id="ch-subs-legend"></div></div>
  <div class="card"><div class="tw"><table id="cost"></table></div></div>
</section>

<section id="findings">
  <div class="mono eyebrow" data-i18n="s4_eyebrow"></div>
  <h2 data-i18n-html="s4_h2"></h2><p class="sub" data-i18n="s4_sub"></p><div class="plan" id="finds"></div>
</section>

<section><div class="mono eyebrow" data-i18n="method_h"></div><p class="sub small" id="method"></p></section>
</main>
<footer><div class="wrap"><div class="fb"><img class="logo-l" alt="" src="__LOGO_LIGHT__"><img class="logo-d" alt="" src="__LOGO_DARK__"><b>__BRAND_NAME__</b></div><span id="foot"></span></div></footer>

/* ---------- derived data ---------- */
const state = {range: 'all', gran: 'day', users: null, eseg: 'all', erec: 'all'};

const refM = META.ref_month, curM = active[active.length - 1];
const rows = D.people.map((p, i) => {
  const per = active.map(m => (p.months[m] || {credits: 0}).credits);
  const lastM = [...active].reverse().find(m => p.months[m]);
  const ref = p.months[refM] || {};

  return {i, eng: p.eng, user: p.user, per, total: sum(per), plan: lastM ? p.months[lastM].plan : '-', sub: sum(get('sub').map(v => v || 0)),
    use: ref.util || 0, over: sum(get('overage').map(v => v || 0)), clients: [...new Set(get('clients').flat().filter(Boolean))],
    rec: p.rec, proj: p.proj, refCredits: ref.credits || 0, refOver: ref.overage || 0};

const totalCr = sum(rows.map(r => r.total));
const costOf = m => D.costs[m] || {sub: 0, offset: 0, estimated: META.estimated_costs};
const totalSub = sum(active.map(m => costOf(m).sub)), offset = sum(active.map(m => costOf(m).offset));

/* ---------- hero ---------- */
function renderHero() {

  const usedUsers = rows.filter(r => r.total > 0).length;

  $('lead').textContent = META.estimated_costs ? t('lead_est', usd(totalSub), period, '', '', save) : t('lead', usd(totalSub), period, usd(-offset), usd(totalSub + offset), save);
  const open = !META.estimated_costs && curNet > 0;
  const k = [

    .filter(Boolean).map(x => `<span>${x}</span>`).join('');
}

/* ---------- activity time series ---------- */
function rangeStart() { return state.range === 'all' ? '0000-00-00' : addDays(META.last_date, -(+state.range - 1)); }
function bucketOf(iso) { return state.gran === 'day' ? iso : state.gran === 'week' ? weekKey(iso) : iso.slice(0, 7); }
function bucketList(from, to) {
  const out = [];
  if (state.gran === 'month') {
    let [y, m] = from.slice(0, 7).split('-').map(Number); const end = to.slice(0, 7);
    for (;;) { const k = `${y}-${String(m).padStart(2, '0')}`; out.push(k); if (k >= end) break; m++; if (m > 12) { m = 1; y++; } }
  } else {
    let cur = state.gran === 'week' ? weekKey(from) : from;
    while (cur <= to) { out.push(cur); cur = addDays(cur, state.gran === 'week' ? 7 : 1); }
  }
  return out;
}
function bucketLabel(b) { return state.gran === 'month' ? mlabel(b) : dShort(b); }
function series(rowsIn, names, nameOf, mode, labels) {
  const maps = new Map(names.map(n => [n, new Map()]));
  rowsIn.forEach(r => {
    const m = maps.get(nameOf(r)), b = bucketOf(r[0]);
    if (mode === 'sum') m.set(b, (m.get(b) || 0) + r[4]); else { if (!m.has(b)) m.set(b, new Set()); m.get(b).add(r[1]); }
  });
  return names.map(n => ({name: n, values: labels.map(b => { const v = maps.get(n).get(b); return v == null ? 0 : (mode === 'sum' ? v : v.size); })}));
}

/* ---------- charts ---------- */
function showTip(host, html, cx, W) {

  tip.style.left = Math.max(0, Math.min((cx / W) * r.width + 14, r.width - 190)) + 'px'; tip.style.top = '10px';
}
const hideTip = host => { host.querySelector('.tip').style.display = 'none'; };
function stacked(id, labels, ser, colors, o = {}) {
  const host = $(id); clearSvg(host);
  const legend = $(id + '-legend');
  if (legend) legend.innerHTML = ser.map((s, i) => `<span><i style="background:${colors[i]}"></i>${esc(s.name)}</span>`).join('');
  if (!labels.length) return;
  const W = 1000, H = o.h || 240, pl = 52, pb = 26, pt = 18, vf = o.fmt || fmt;

    el('text', {x: pl - 8, y: y + 4, 'text-anchor': 'end'}, svg).textContent = (o.prefix || '') + compact(max * i / 4);
  }

    let y = H - pb; const x = pl + i * bw;
    ser.forEach((s, k) => { const v = s.values[i]; if (v <= 0) return; const h = (H - pt - pb) * v / max; y -= h;
      el('rect', {x: x + bw * .1, y, width: bw * .8, height: h, rx: 1.5, fill: colors[k]}, svg); });
    if (o.top) { const tp = o.top(i); el('text', {x: x + bw / 2, y: y - 6, 'text-anchor': 'middle', style: `fill:${tp.color};font-weight:600`}, svg).textContent = tp.text; }
    if (i % step === 0) el('text', {x: x + bw / 2, y: H - 8, 'text-anchor': 'middle'}, svg).textContent = (o.label || (b => b))(lb);

      ser.filter(s => s.values[i]).map((s, _, a) => `<div><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${colors[ser.indexOf(s)]};margin-right:6px"></i>${esc(s.name)}</span><span>${vf(s.values[i])}</span></div>`).join('') +

}

let sortKey = 'total', asc = false;
function drawTable() {

  const val = (r, k) => /^m\d+$/.test(k) ? r.per[+k.slice(1)] : k === 'clients' ? r.clients.join(',') : k === 'rec' ? (r.rec ? r.rec.saving : 0) : r[k];
  const list = vrows();

  sorted.forEach(r => {
    const tone = r.use < 10 ? 'crit' : r.use < 50 ? 'warn' : r.use > 100 ? 'crit' : 'ok';
    h += `<tr><td>${esc(r.user)}</td><td><span class="pill info">${esc(planLabel(r.plan))}</span></td>` + (ACT ? `<td class="muted">${esc(r.clients.join(', ')) || '–'}</td>` : '') +
      r.per.map(v => `<td class="num">${v ? fmt(v) : '–'}</td>`).join('') +
      `<td class="num">${fmt(r.total)}<div class="bar"><i style="width:${r.total / max * 100}%"></i></div></td><td class="num">${usd(r.sub)}</td><td class="num"><span class="pill ${tone}">${Math.round(r.use)}%</span></td>` +
      (ACT ? `<td class="num">${r.over ? fmt(r.over) : '–'}</td>` : '') +
      `<td>${r.rec ? `→ <b>${esc(planLabel(r.rec.to))}</b> <span class="muted">(−$${r.rec.saving})</span>` : '<span class="muted">–</span>'}</td></tr>`;
  });

    `<td class="num">${fmt(sum(list.map(r => r.total)))}</td><td class="num">${usd(sum(list.map(r => r.sub)))}</td><td></td>` + (ACT ? `<td class="num">${fmt(sum(list.map(r => r.over)))}</td>` : '') + '<td></td></tr></tfoot>';
  const tb = $('tbl'); tb.innerHTML = h;

/* ---------- engagement ---------- */
function donut(host, items, total) {
  const R = 70, C = 2 * Math.PI * R; let off = 0;
  const svg = el('svg', {viewBox: '0 0 200 200', role: 'img'});
  el('circle', {cx: 100, cy: 100, r: R, fill: 'none', stroke: css('--surface2'), 'stroke-width': 28}, svg);
  items.filter(i => i.value > 0).forEach(i => {
    const len = C * i.value / total;
    el('circle', {cx: 100, cy: 100, r: R, fill: 'none', stroke: i.color, 'stroke-width': 28, 'stroke-dasharray': `${len} ${C - len}`,
      'stroke-dashoffset': -off, transform: 'rotate(-90 100 100)'}, svg); off += len;
  });
  el('text', {x: 100, y: 106, class: 'center'}, svg).textContent = total;
  el('text', {x: 100, y: 126, class: 'centerl'}, svg).textContent = t('seg_users');
  return svg;
}
function engRows() { return vrows().filter(r => r.eng); }

  const ser = names.map(n => ({name: planLabel(n) + ' ($' + META.tiers.find(x => x.name === n).price + ')', values: active.map(m => planSub(m, n))}));
  const other = active.map(m => sum(D.people.map(p => (p.months[m] && !known.has(p.months[m].plan)) ? p.months[m].sub : 0)));

  active.forEach((m, i) => { const c = costOf(m), n = c.sub + c.offset;

  const over = rows.filter(r => r.refOver > 0);

  const pm = META.proj_month, pr = rows.filter(r => r.proj);
  const willOver = pr.filter(r => r.proj.over_cost > 0).sort((a, b) => b.proj.over_cost - a.proj.over_cost);
  if (pm && willOver.length) steps.push(['semana', 'w_week', t('f_proj_t', mlabel(pm)),
    t('f_proj_p', willOver.length, mlabel(pm), willOver.map(r => `${esc(r.user)} (${fmt(r.proj.credits)}/${fmt(r.proj.cap)})`).join(', '), fmt(sum(willOver.map(r => r.proj.over_cost))), META.proj_elapsed)]);
  const near = pr.filter(r => r.proj.over_cost === 0 && r.proj.use >= 80);
  if (pm && near.length) steps.push(['semana', 'w_week', t('f_near_t'), t('f_near_p', near.length, mlabel(pm), near.map(r => `${esc(r.user)} (${Math.round(r.proj.use)}%)`).join(', '), META.proj_elapsed)]);

  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(e => { e.innerHTML = t(e.dataset.i18nHtml); });
  const src = [META.source_cur && 'CUR ' + META.source_cur, META.source_activity && 'Kiro activity report ' + META.source_activity].filter(Boolean).join(' + ') || '—';
  $('method').textContent = t('method_p', src, META.first_date);
  $('foot').textContent = t('foot', META.generated);
  $('lang').textContent = LANG === 'es' ? 'EN' : 'ES';
  document.documentElement.lang = LANG;
}
function renderAll() {
  renderStatic(); renderHero(); renderControls(); renderActivity(); renderCurDaily();
  $('act-charts').classList.toggle('hidden', !ACT);
  renderUserFilter(); renderDefs(); renderPeople(); renderEngagement(); renderCosts(); renderFindings();
}
$('exp-people').onclick = exportPeople;
$('exp-eng').onclick = exportEngagement;
$('lang').onclick = () => { LANG = LANG === 'es' ? 'en' : 'es'; renderAll(); };
$('theme').onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark'; renderAll();
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderAll);
window.addEventListener('beforeprint', () => { document.documentElement.dataset.theme = 'light'; renderAll(); });
renderAll();
</script>
</body>
